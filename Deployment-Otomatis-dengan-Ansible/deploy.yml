
---
- name: Deploy TNIS application using Ansible
  hosts: deployment
  become: true
  gather_facts: true

  vars:
    project_src: "{{ playbook_dir }}/.."
    deploy_dir: /opt/tnis-junior-se
    postgres_volume_name: tnis-junior_se_postgres_data

  tasks:
    - name: Check whether Docker is installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install Docker on openSUSE when missing
      community.general.zypper:
        name: docker
        state: present
      when:
        - docker_check.rc != 0
        - ansible_os_family == "Suse"

    - name: Verify Docker is available
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Verify Docker Compose plugin
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Verify existing PostgreSQL volume
      ansible.builtin.command:
        cmd: "docker volume inspect {{ postgres_volume_name }}"
      register: postgres_volume_check
      changed_when: false
      failed_when: postgres_volume_check.rc != 0
      check_mode: false

    - name: Create deployment directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Copy project files to target
      ansible.builtin.copy:
        src: "{{ project_src }}/"
        dest: "{{ deploy_dir }}/"
        mode: preserve
    
    - name: Verify source environment file exists
      ansible.builtin.stat:
        path: "{{ project_src }}/.env"
      register: source_env_file

    - name: Stop if source environment file is missing
      ansible.builtin.fail:
        msg: "File .env tidak ditemukan di direktori sumber proyek."
      when: not source_env_file.stat.exists

    - name: Set environment file permissions
      ansible.builtin.file:
        path: "{{ deploy_dir }}/.env"
        state: file
        mode: "0600"
      when: not ansible_check_mode

    - name: Deploy application with Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ deploy_dir }}"
      register: compose_result
      changed_when: true

    - name: Display deployment result
      ansible.builtin.debug:
        var: compose_result.stdout_lines
